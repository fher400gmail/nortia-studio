name: ffmpeg-sidecar

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/ffmpeg/**'
      - '.github/workflows/ffmpeg-sidecar.yml'

permissions:
  contents: read

concurrency:
  group: ffmpeg-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runner propio (Mac de Fer, D-35). Un solo runner: los jobs se encolan y van uno tras otro.
  prepare:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    outputs:
      ffmpeg_version: ${{ steps.v.outputs.ffmpeg_version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: PATH del runner (el servicio no carga .zshrc)
        run: |
          for d in "$HOME/.cargo/bin" /opt/homebrew/bin /usr/local/bin; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          exit 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: v
        run: |
          source tools/ffmpeg/common.sh
          V=$(resolve_ffmpeg_version)
          test -n "$V"
          echo "ffmpeg_version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=ffmpeg-sidecar-v${V}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120
    env:
      FFMPEG_VERSION: ${{ needs.prepare.outputs.ffmpeg_version }}
      # Mac personal: como mucho 4 hilos de compilación (lo lee ncpu() de tools/ffmpeg/common.sh).
      NCPU: "4"
    steps:
      - name: PATH del runner (el servicio no carga .zshrc)
        run: |
          for d in "$HOME/.cargo/bin" /opt/homebrew/bin /usr/local/bin; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          exit 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: false
      - name: Limpiar el espacio de trabajo
        run: git clean -ffdx
      - name: Preflight del runner (nada se instala desde el workflow)
        run: tools/ci/runner-preflight.sh --cmd nasm --cmd pkg-config --cmd gpg --cmd curl --cmd clang --cmd lipo --cmd codesign --cmd otool --cmd tar --cmd xz
      - name: Compilar (arm64 + x86_64, lipo)
        run: tools/ffmpeg/build-macos.sh "$RUNNER_TEMP/work" "$PWD/dist"
      - name: Comprobar enlaces (lista blanca) y minos 14.0
        run: |
          for f in dist/ffmpeg-universal-apple-darwin dist/ffprobe-universal-apple-darwin; do
            for a in arm64 x86_64; do
              echo "--- $f ($a)"; otool -arch $a -L "$f"
              # solo librerías del sistema (/usr/lib, /System/Library)
              if otool -arch $a -L "$f" | tail -n +2 | grep -vE '^[[:space:]]+(/usr/lib/|/System/Library/)'; then echo "enlace fuera de la lista blanca"; exit 1; fi
              otool -arch $a -l "$f" | grep -A4 LC_BUILD_VERSION | tee /dev/stderr | grep -q 'minos 14.0' || { echo "minos != 14.0"; exit 1; }
            done
          done
      # Cada slice solo se puede ejecutar si el Mac lo soporta: arm64 solo en Apple Silicon;
      # x86_64 en Intel, o en Apple Silicon con Rosetta. Si no, aviso visible (y solo otool/lipo).
      - name: Pruebas de aceptación (slice arm64)
        run: |
          if arch -arm64 /usr/bin/true 2>/dev/null; then
            ACCEPT_ARCH=arm64 tools/ffmpeg/accept.sh dist/ffmpeg-universal-apple-darwin dist/ffprobe-universal-apple-darwin h264_videotoolbox dist "$RUNNER_TEMP/accept-arm64"
          else
            echo "::warning::Este Mac no ejecuta arm64 (Intel): slice arm64 sin aceptación funcional, solo otool/lipo."
          fi
      - name: Pruebas de aceptación (slice x86_64; en Apple Silicon requiere Rosetta)
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            ACCEPT_ARCH=x86_64 tools/ffmpeg/accept.sh dist/ffmpeg-universal-apple-darwin dist/ffprobe-universal-apple-darwin h264_videotoolbox dist "$RUNNER_TEMP/accept-x86_64"
          else
            echo "::warning::Este Mac no ejecuta x86_64 (falta Rosetta: softwareupdate --install-rosetta --agree-to-license): slice x86_64 sin aceptación funcional."
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-sidecar-macos
          path: dist/
          if-no-files-found: error

  # Windows queda aparcado (D-34/D-35): solo corre con la variable de repo HOSTED_RUNNERS == 'true'.
  windows:
    needs: prepare
    if: vars.HOSTED_RUNNERS == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      FFMPEG_VERSION: ${{ needs.prepare.outputs.ffmpeg_version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: msys2/setup-msys2@61f9e5e925871ba6c9e3e8da24ede83ea27fa91f # v2.27.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python
            nasm make pkg-config diffutils curl tar xz
      - name: Caché del build (binarios y fuentes)
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: dist
          key: win-build-${{ hashFiles('tools/ffmpeg/build-windows.sh', 'tools/ffmpeg/common.sh', 'tools/ffmpeg/fetch-sources.sh') }}-${{ needs.prepare.outputs.ffmpeg_version }}
      - name: Compilar
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/ffmpeg/build-windows.sh "$RUNNER_TEMP/work" "$PWD/dist"
      - name: Guardar caché del build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: dist
          key: win-build-${{ hashFiles('tools/ffmpeg/build-windows.sh', 'tools/ffmpeg/common.sh', 'tools/ffmpeg/fetch-sources.sh') }}-${{ needs.prepare.outputs.ffmpeg_version }}
      - name: Comprobar DLLs importadas (lista blanca)
        run: |
          for f in dist/ffmpeg-x86_64-pc-windows-msvc.exe dist/ffprobe-x86_64-pc-windows-msvc.exe; do
            echo "--- $f"; objdump -p "$f" | grep 'DLL Name'
            if objdump -p "$f" | grep 'DLL Name' | sed 's/.*DLL Name: *//' | grep -viE '^(advapi32|bcrypt|kernel32|msvcrt|ole32|oleaut32|shell32|user32|gdi32|ws2_32|mfplat|mf|mfreadwrite|mfuuid|strmiids|uuid)\.dll$'; then echo "DLL fuera de la lista blanca"; exit 1; fi
          done
      - name: Pruebas de aceptación
        run: tools/ffmpeg/accept.sh dist/ffmpeg-x86_64-pc-windows-msvc.exe dist/ffprobe-x86_64-pc-windows-msvc.exe h264_mf dist "$RUNNER_TEMP/accept"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-sidecar-windows
          path: dist/
          if-no-files-found: error

  # Publicación del release: también en el Mac propio. Sin Windows (job desactivado) publica solo los
  # binarios de macOS; SHA256SUMS lista lo que haya. fetch-sidecar.sh falla con mensaje claro si
  # luego alguien pide el sidecar de Windows de un release que no lo trae.
  release:
    needs: [prepare, macos, windows]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.macos.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      HAVE_WINDOWS: ${{ needs.windows.result == 'success' }}
    steps:
      - name: PATH del runner (el servicio no carga .zshrc)
        run: |
          for d in "$HOME/.cargo/bin" /opt/homebrew/bin /usr/local/bin; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          exit 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: false
      - name: Limpiar el espacio de trabajo
        run: git clean -ffdx
      - name: Preflight del runner
        run: tools/ci/runner-preflight.sh --cmd gh --cmd cmp
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-sidecar-macos
          path: art/macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.windows.result == 'success'
        with:
          name: ffmpeg-sidecar-windows
          path: art/windows
      - name: Reunir archivos del release
        run: |
          mkdir rel
          cp art/macos/ffmpeg-universal-apple-darwin art/macos/ffprobe-universal-apple-darwin rel/
          # comunes (idénticos en ambos SO): fuentes, firma, licencias
          cp art/macos/ffmpeg-*.tar.xz art/macos/ffmpeg-*.tar.xz.asc art/macos/lame-*.tar.gz \
             art/macos/LICENSE.LGPLv2.1 art/macos/COPYING.LGPL art/macos/LICENSE.lame rel/
          cp art/macos/configure_line.txt rel/configure_line-macos.txt
          # buildconf por slice: solo existe el de los slices que este Mac pudo ejecutar
          n=0
          for a in arm64 x86_64; do
            if [ -f "art/macos/buildconf-$a.txt" ]; then cp "art/macos/buildconf-$a.txt" "rel/buildconf-macos-$a.txt"; n=$((n+1))
            else echo "::warning::falta buildconf-$a.txt: el slice $a no se pudo ejecutar en este Mac (aceptación funcional pendiente)"; fi
          done
          test "$n" -ge 1
          if [ "$HAVE_WINDOWS" = "true" ]; then
            cp art/windows/ffmpeg-x86_64-pc-windows-msvc.exe art/windows/ffprobe-x86_64-pc-windows-msvc.exe rel/
            cmp art/macos/ffmpeg-*.tar.xz art/windows/ffmpeg-*.tar.xz
            cmp art/macos/lame-*.tar.gz art/windows/lame-*.tar.gz
            cp art/windows/configure_line.txt rel/configure_line-windows.txt
            cp art/windows/buildconf.txt rel/buildconf-windows.txt
          else
            echo "::warning::Release SOLO de macOS: el job de Windows no se ha ejecutado (vars.HOSTED_RUNNERS != 'true')."
          fi
          tools/ffmpeg/finalize.sh rel
          ls -l rel
      - name: Crear o actualizar release
        run: |
          NOTES="Sidecar ffmpeg LGPL (sin GPL ni nonfree) para master check. Fuentes exactas, configure_line y licencias adjuntas. Commit ${GITHUB_SHA}."
          if [ "$HAVE_WINDOWS" != "true" ]; then NOTES="$NOTES Solo macOS (sin binarios de Windows)."; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" rel/* --clobber
          else
            gh release create "$TAG" rel/* --prerelease --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
          fi
