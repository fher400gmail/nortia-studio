<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=1440">
<title>Master Out · D2 Un solo flujo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<style>
/*__COMMON_CSS__*/
/* ---- D2 Un solo flujo ---- */
body{background:var(--bg)}
.stepper{position:relative;display:grid;grid-template-columns:repeat(4,1fr);width:980px;margin:14px auto 0;height:70px;flex:none}
.stepper .line{position:absolute;left:12.5%;right:12.5%;top:17px;height:3px;border-radius:3px;background:var(--line)}
.stepper .line i{display:block;height:100%;background:var(--st);border-radius:3px;transition:width .6s cubic-bezier(.3,.8,.3,1)}
.st{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;z-index:1}
.st .nd{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;background:var(--bg);border:2px solid var(--line);color:var(--tx3);transition:all .3s}
.st.done .nd{background:var(--st);border-color:var(--st);color:var(--bg)}
:root[data-theme=dark] .st.done .nd{color:#0A1429}
.st.cur .nd{visibility:hidden}
.st .sl{font-size:13px;color:var(--tx3);font-weight:500;transition:color .3s}
.st.done .sl{color:var(--tx2)}.st.cur .sl{color:var(--tx);font-weight:600}
.st:hover .sl{color:var(--tx)}
.mk{pointer-events:none;position:absolute;top:-2px;transform:translateX(-50%);background:var(--bg);padding:0 9px;border-radius:99px;height:40px;display:flex;align-items:center;transition:left .6s cubic-bezier(.3,.8,.3,1);z-index:2}
.main{flex:1;min-height:0;padding:14px 100px 20px;position:relative}
.hd h1{font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.hd p{font-size:15px;color:var(--tx2);margin-top:6px;max-width:640px;line-height:1.45}
.pane{display:none;height:100%;flex-direction:column;gap:18px}
.pane.cur{display:flex;animation:pin .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes pin{from{opacity:0;transform:translateX(18px)}}
.two{flex:1;min-height:0;display:grid;grid-template-columns:1fr 440px;gap:48px}
.two.wide{grid-template-columns:1fr 340px}
.foot{height:76px;flex:none;border-top:1px solid var(--line);background:var(--surf);display:flex;align-items:center;gap:16px;padding:0 100px}
.foot .sm{color:var(--tx2);font-size:13px;display:flex;gap:16px}.foot .sm b{color:var(--tx);font-weight:600}
.foot .btn{height:42px;padding:0 20px;font-size:14px;border-radius:9px}
.foot .btn.pri{min-width:190px;justify-content:center}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px}
.big .fld label{font-size:12.5px}.big .fld input{height:40px;font-size:14px;padding:0 12px;border-radius:9px}
.big .okmark{top:12px}
/* paso 1 */
.wbox{padding:22px 24px 16px}
.wbox .wvw{margin:6px 0 0}
.ruler{display:flex;justify-content:space-between;color:var(--tx3);font-size:11.5px;margin-top:8px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:20px}
.fx{display:grid;grid-template-columns:auto 1fr;font-size:13.5px}
.fx dt,.fx dd{padding:10px 0;border-bottom:1px solid var(--line)}.fx dt{color:var(--tx3)}.fx dd{text-align:right;font-weight:500}
.fx dt:nth-last-of-type(1),.fx dd:last-of-type{border:0}
.alert{display:flex;gap:11px;padding:13px 14px;border-radius:11px;background:var(--er-bg);color:var(--er);align-items:flex-start}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px}.alert b{display:block;font-size:13.5px}.alert span{display:block;color:var(--tx2);font-size:12.5px;margin-top:2px;line-height:1.4}
.alert.wn{background:var(--wn-bg);color:var(--wn-tx)}
.chipf{display:inline-flex;gap:9px;align-items:center;font-size:13px;color:var(--tx2);margin-top:2px}
.chipf b{color:var(--tx);font-weight:600}
/* paso 2 */
.formg{align-content:start;display:grid;grid-template-columns:1fr 1fr;gap:18px 18px;max-width:640px}
.formg .full{grid-column:1/-1}.hint{font-size:11.5px;color:var(--tx3)}
.covbox{align-self:start;padding:20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.chk{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--tx2)}.chk span{display:flex;gap:8px;align-items:center}.chk svg{width:14px;height:14px;color:var(--ok)}
/* paso 3 */
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--line);font-weight:500;font-size:13px;color:var(--tx2);display:flex;gap:8px;align-items:center}
.tab em{font-style:normal;font-size:11.5px;color:var(--tx3);background:var(--surf2);border-radius:99px;padding:1px 7px}
.tab.cur{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}.tab.cur em{background:rgba(255,255,255,.18);color:inherit}
:root[data-theme=dark] .tab.cur em{background:rgba(15,31,61,.15)}
.list{overflow:hidden}
.row{display:grid;grid-template-columns:40px 34px 1fr auto;align-items:center;gap:14px;padding:13px 18px;min-height:70px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s}
.row:last-child{border:0}.row:hover{background:var(--surf2)}
.row .nm{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .nm b{font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
.row .nm .sp2{font-size:12.5px;color:var(--tx3)}
.row .why{font-size:12.5px;display:flex;gap:6px;align-items:flex-start;line-height:1.35;margin-top:1px;font-weight:500}

.row .why.ok{color:var(--ok)}.row .why.wn{color:var(--wn-tx)}.row .why.er{color:var(--er)}
.row.off .nm b,.row.off .sp2{opacity:.55}.row.off .why{display:none}
.row .mono{width:34px;height:34px;font-size:11px}
.row .rt{justify-self:end}
.row.off .sevoff{display:inline-flex}.row.on .sevoff{display:none}
.sevoff{align-items:center;gap:5px;font-size:11.5px;font-weight:600;opacity:.8}
.sevoff.ok{color:var(--ok)}.sevoff.wn{color:var(--wn-tx)}.sevoff.er{color:var(--er)}.sevoff svg{width:13px;height:13px}
.tp{display:flex;flex-direction:column;min-height:0;padding:16px 16px 12px}
.tp .th{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.tp .th b{font-size:14px;font-weight:600}.tp .th span{font-size:12px;color:var(--tx3)}
.tp .tree{flex:1;overflow:auto}.tp .tr{height:22px}.tp .tree::-webkit-scrollbar{display:none}
.tp .tf{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:8px;font-size:12px;color:var(--tx2)}.tp .tf b{color:var(--tx)}
/* paso 4 */
.rev{padding:6px 20px}
.rv{display:grid;grid-template-columns:100px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rv:last-child{border:0}.rv .k{color:var(--tx3)}.rv .v{font-weight:500}
.rv a{color:var(--st);font-weight:600;font-size:12.5px;cursor:pointer}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{display:inline-flex;gap:6px;align-items:center;height:26px;padding:0 10px 0 8px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;font-weight:500}
.dchip svg{width:13px;height:13px}.dchip .ok{color:var(--ok)}.dchip .wn{color:var(--wn)}.dchip .er{color:var(--er)}
.xph{padding:22px 24px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.xph .pct{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1}
.xph .bar{height:8px}
.dp{display:grid;grid-template-columns:22px 170px 1fr 44px;gap:10px;align-items:center;font-size:13px;padding:6px 0}
.dp .mono{width:22px;height:22px;font-size:10px}.dp .bar{height:5px}.dp .pp{text-align:right;color:var(--tx2);font-size:12px}
.dp.fin .pp{color:var(--ok)}.dp.fin .bar i{background:var(--ok)}
.fin-h{display:flex;gap:18px;align-items:center}.fin-h h2{font-size:22px;font-weight:600;letter-spacing:-.02em}.fin-h p{color:var(--tx2);margin-top:3px;font-size:14px}
</style></head><body><div class="win" id="app"></div>
<script>
/*__COMMON_JS__*/
const app=document.getElementById('app');
let cur=+(Q.get('step')||3);if(Q.get('state')==='exporting'||Q.get('state')==='done')cur=4;
const STEPS=['Máster','Datos','Destinos','Exportar'];
const HEAD=[['Este es tu máster','Lo hemos medido sin tocarlo. Esto es lo que verán las plataformas.'],
 ['¿Cómo se llama el tema?','Estos datos van en los nombres de archivo y en la ficha de lanzamiento.'],
 ['¿Dónde vas a publicar?','Activa los destinos. Verás qué archivo recibe cada uno y si el máster cumple.'],
 ['Todo listo para exportar','Revisa el resumen. Master Out crea la carpeta con un archivo correcto por destino.']];
const fld=(l,v,c='',ok,h)=>`<div class="fld ${c}"><label>${l}</label><div class="rel"><input value="${v}" ${ok?'style="padding-right:34px"':''}>${ok?`<span class="okmark">${IC.check.replace('class="ic"','class="ic" style="width:15px;height:15px"')}</span>`:''}</div>${h?`<span class="hint">${h}</span>`:''}</div>`;
const treePanel=(t)=>`<div class="card tp"><div class="th"><b>${t}</b><span id="tcount"></span></div><div class="tree" id="tree"></div><div class="tf" id="tfoot"></div></div>`;
const panes=[
/* 1 */`<div class="two wide"><div><div class="card wbox"><div style="display:flex;justify-content:space-between;align-items:center"><div class="chipf">${IC.file}<b>${M.file}</b> · ${M.fmt} · ${M.bits} bit · ${M.khz} kHz</div><div style="display:flex;gap:8px"><button class="btn sm">${IC.play}Escuchar</button><button class="btn sm">Cambiar máster</button></div></div>
 <div class="wvw" style="margin-top:14px"><div class="wdraw">${waveSVG(804,250,134,{prog:.31,clips:true})}</div><div class="playhead" style="left:31%;top:-6px;bottom:-6px"></div></div>
 <div class="ruler"><span>0:00</span><span>1:00</span><span>2:00</span><span>3:00</span><span>${M.dur}</span></div>
 <div class="mrow">${lufsMeter()}${tpMeter()}</div></div></div>
 <div style="display:flex;flex-direction:column;gap:16px"><div class="alert">${IC.er}<div><b>3 picos sobre 0 dBTP</b><span>Se marcan en rojo en la onda. Algunos destinos avisarán.</span></div></div>
 <dl class="fx"><dt>Resolución</dt><dd>${M.bits} bit · ${M.khz} kHz</dd><dt>Canales</dt><dd>${M.ch}</dd><dt>Duración</dt><dd>${M.dur}</dd><dt>Tamaño</dt><dd>${M.size}</dd><dt>Rango (LRA)</dt><dd>${nf(M.lra)} LU</dd></dl>
 <p class="chipf" style="color:var(--tx2);align-items:flex-start;line-height:1.4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>Tu máster no se modifica. Master Out mide y avisa.</p></div></div>`,
/* 2 */`<div class="two wide big"><div class="formg">${fld('Título',TIT)}${fld('Artista principal',ART)}${fld('Featuring','')}${fld('Versión','','',false,'Por ejemplo: Radio Edit')}${fld('Año','2026')}${fld('ISRC','ES-ABC-26-00417','',true,'Formato CC-XXX-YY-NNNNN')}
  <div class="full"><button class="btn quiet" style="padding:0;height:auto">Más campos: compositores, editorial, sello, ℗ y ©, UPC${IC.down}</button></div></div>
 <div class="card covbox">${cover(240)}<div class="chk"><span>${IC.check}3000×3000 px</span><span>${IC.check}Cuadrada</span><span>${IC.check}Perfil sRGB</span></div><button class="btn sm">Cambiar portada</button></div></div>`,
/* 3 */`<div class="two"><div><div class="tabs" id="tabs"></div><div class="card list" id="list"></div></div>${treePanel('Así queda tu carpeta')}</div>`,
/* 4 */`<div class="two"><div id="s4left"></div>${treePanel('Carpeta de salida')}</div>`];
app.innerHTML=titlebar()+`<div class="stepper" id="stp"><div class="line"><i></i></div>${STEPS.map((s,i)=>`<button class="st" data-s="${i+1}"><span class="nd"></span><span class="sl">${s}</span></button>`).join('')}<div class="mk">${sym(36)}</div></div>
<div class="main"><div id="panes" style="height:100%">${panes.map((p,i)=>`<section class="pane" data-p="${i+1}"><div class="hd"><h1>${HEAD[i][0]}</h1><p>${HEAD[i][1]}</p></div>${p}</section>`).join('')}</div></div>
<div class="foot" id="foot"></div>`;
themeInit();
let tab='Streaming';
function stepUI(){
  document.querySelectorAll('.st').forEach(b=>{const i=+b.dataset.s;b.classList.toggle('done',i<cur);b.classList.toggle('cur',i===cur);b.querySelector('.nd').innerHTML=i<cur?IC.check:i});
  document.querySelector('.stepper .line i').style.width=((cur-1)/3*100)+'%';
  document.querySelector('.mk').style.left=(12.5+(cur-1)*25)+'%';
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('cur',+p.dataset.p===cur));
  mountTrees();foot();dyn()}
function go(n){cur=Math.max(1,Math.min(4,n));stepUI();const u=new URL(location);u.searchParams.set('step',cur);history.replaceState(0,'',u)}
document.querySelectorAll('.st').forEach(b=>b.onclick=()=>go(+b.dataset.s));
function mountTrees(){const pane=document.querySelector('.pane.cur');const el=pane.querySelector('#tree');
  document.querySelectorAll('#tree').forEach(n=>n.removeAttribute('id'));
  /* un solo árbol activo a la vez */
  if(el){el.id='tree';MO.subs=MO.subs.filter(f=>!f.isTree);MO.mountTree(el);MO.subs[MO.subs.length-1].isTree=true}}
function tabsHTML(){return GROUPS.map(g=>{const ds=D.filter(d=>d.g===g),n=ds.filter(d=>MO.on.has(d.id)).length;return `<button class="tab ${g===tab?'cur':''}" data-g="${g}">${g}<em>${n}/${ds.length}</em></button>`}).join('')}
function listHTML(){return D.filter(d=>d.g===tab).map(d=>{const on=MO.on.has(d.id);return `<div class="row ${on?'on':'off'}" data-id="${d.id}"><button class="sw" role="switch" aria-checked="${on}" aria-label="${d.n}"></button>
 <span class="mono ${on?'on':''}">${d.m}</span><div class="nm"><b>${d.n}</b><span class="sp2">${d.spec}</span>${on?`<span class="why ${d.sev}">${d.why.replace(/^Cumple · /,'').replace(/^./,c=>c.toUpperCase())}</span>`:''}</div>
 <div class="rt"><span class="sevoff ${d.sev}">${IC[d.sev]}${SEVL[d.sev]}</span></div></div>`}).join('')}
function dyn(){
  const s=MO.stats();
  if(cur===3){const t=document.getElementById('tabs'),l=document.getElementById('list');t.innerHTML=tabsHTML();l.innerHTML=listHTML();
    t.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.g;dyn()});
    l.querySelectorAll('.row').forEach(r=>r.onclick=()=>MO.toggle(r.dataset.id));
    /* row layout: icono de semáforo como 3ª columna cuando está activo */
    l.querySelectorAll('.row.on').forEach(r=>{const d=MO.byId[r.dataset.id];r.querySelector('.rt').innerHTML=`<span class="sev ${d.sev}">${IC[d.sev]}${SEVL[d.sev]}</span>`})}
  if(cur===4){const h=document.querySelector('.pane.cur .hd');const m=MO.exp.mode;h.querySelector('h1').textContent=m==='run'?'Exportando tu entrega':m==='done'?'Entrega terminada':HEAD[3][0];h.querySelector('p').textContent=m==='run'?'Cada destino se procesa en paralelo. Puedes cancelar sin dejar archivos a medias.':m==='done'?'Abre la carpeta y sube cada archivo a su plataforma.':HEAD[3][1]}
  const tc=document.getElementById('tcount');if(tc)tc.textContent=s.n+' archivos + '+s.docs+' documentos';
  const tf=document.getElementById('tfoot');if(tf)tf.innerHTML=`<span><b>${s.n+s.docs}</b> archivos</span><span><b>${sizeStr(s.mb)}</b></span>`;
  if(cur===4)s4()}
function s4(){const el=document.getElementById('s4left'),e=MO.exp,s=MO.stats();let h;
 const act=D.filter(d=>MO.on.has(d.id));
 if(e.mode==='idle'){
  h=`<div class="card rev"><div class="rv"><span class="k">Tema</span><span class="v">${ART} — ${TIT}</span><a>Cambiar</a></div>
  <div class="rv"><span class="k">Máster</span><span class="v">${M.bits} bit · ${M.khz} kHz · ${nf(M.lufs)} LUFS · +${nf(M.tp)} dBTP</span><a>Ver</a></div>
  <div class="rv"><span class="k">Carpeta</span><span class="v">~/Música/Entregas</span><a>Cambiar</a></div>
  <div class="rv" style="align-items:flex-start"><span class="k" style="padding-top:4px">Destinos</span><div class="dchips">${act.map(d=>`<span class="dchip"><span class="${d.sev}">${IC[d.sev]}</span>${d.n}</span>`).join('')}</div><a data-go="3">Editar</a></div></div>
  <div class="alert wn" style="margin-top:16px">${IC.wn}<div><b>${s.er} destinos no cumplen: ${act.filter(d=>d.sev==='er').map(d=>d.n).join(' y ')}</b><span>Puedes exportar igualmente. El máster no se modifica; para corregir el pico, vuelve a tu DAW.</span></div></div>`}
 else if(e.mode==='run'){const o=MO.overall();
  h=`<div class="card xph"><div style="display:flex;justify-content:space-between;align-items:flex-end"><span class="pct" data-totalpc>${Math.round(o)} %</span><span style="color:var(--tx2);font-size:14px" data-eta>${MO.eta()}</span></div><div class="bar"><i data-total style="width:${o}%"></i></div>
   <div>${act.map(d=>{const fs=MO.files().filter(x=>x.d&&x.d.id===d.id);const p=fs.reduce((a,x)=>a+(MO.exp.pct[x.k]||0)*x.mb,0)/fs.reduce((a,x)=>a+x.mb,0);return `<div class="dp ${p>=99.9?'fin':''}"><span class="mono on">${d.m}</span><span>${d.n}</span><span class="bar"><i style="width:${p}%"></i></span><span class="pp">${p>=99.9?'Listo':Math.round(p)+' %'}</span></div>`}).join('')}</div></div>`}
 else{h=`<div class="card xph" id="doneBox" style="padding:34px 28px;gap:22px"><div class="fin-h">${MO.doneMark(64)}<div><h2>Todo exportado</h2><p>${s.n+s.docs} archivos · ${sizeStr(s.mb)} · ${nf(MO.exp.secs||7.4)} s</p></div></div>
   <div style="display:flex;gap:10px"><button class="btn pri" style="height:44px;padding:0 20px">${IC.reveal}Mostrar en Finder</button><button class="btn" style="height:44px;padding:0 18px" id="again">Nueva entrega</button></div>
   <p style="color:var(--tx2);font-size:13px">El README explica qué archivo va a cada plataforma y por qué.</p></div>`}
 el.innerHTML=h;el.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>go(+a.dataset.go));
 if(e.mode==='done'&&!e.celebrated){e.celebrated=1;MO.confetti(document.getElementById('doneBox'))}
 const ag=document.getElementById('again');if(ag)ag.onclick=()=>{MO.exp={mode:'idle',pct:{}};MO.refresh();foot()}}
function foot(){const s=MO.stats(),e=MO.exp;let h='';const back=cur>1&&e.mode!=='run'?`<button class="btn" id="bk">${IC.left}Atrás</button>`:'<span></span>';
 const sm=`<div class="sm"><span><b>${s.dest}</b> destinos</span><span><b>${s.n+s.docs}</b> archivos</span><span><b>${sizeStr(s.mb)}</b></span></div>`;
 let nx;
 if(cur<3)nx=`<button class="btn pri" id="nx">Siguiente: ${STEPS[cur]}${IC.chev}</button>`;
 else if(cur===3)nx=`<button class="btn pri" id="nx">Siguiente: Exportar${IC.chev}</button>`;
 else if(e.mode==='idle')nx=`<button class="btn pri" id="nx">Exportar ${s.dest} destinos</button>`;
 else if(e.mode==='run')nx=`<button class="btn" id="cx">Cancelar</button>`;
 else nx=`<span></span>`;
 document.getElementById('foot').innerHTML=back+'<div class="sp"></div>'+(e.mode==='done'?'':sm)+nx;
 const b=document.getElementById('bk');if(b)b.onclick=()=>go(cur-1);
 const n=document.getElementById('nx');if(n)n.onclick=()=>cur===4?MO.start():go(cur+1)}
MO.subs.push(()=>{dyn();if(cur===4)foot()});
MO.listeners.push(()=>foot());
if(Q.get('state')==='exporting')MO.snapshot();
if(Q.get('state')==='done'){MO.files().forEach(x=>MO.exp.pct[x.k]=100);MO.exp.mode='done';MO.exp.celebrated=1;MO.exp.secs=7.4}
document.querySelector('.stepper .line i').style.transition='none';
stepUI();
if(STILL){document.querySelector('.mk').style.transition='none'}
</script></body></html>
