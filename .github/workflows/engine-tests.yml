name: engine

on:
  push:
    paths:
      - "engine/**"
      - ".github/workflows/engine-tests.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-tests.yml"

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Instalar ffmpeg (pruebas de MP3, imagen y vídeo)
        timeout-minutes: 8
        continue-on-error: true
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y ffmpeg
      - run: cargo fmt --all --check --manifest-path engine/Cargo.toml
      - run: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings
      - name: Clippy cruzado para Windows (imports solo-unix y cfg)
        run: cargo clippy --manifest-path engine/Cargo.toml --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo test --manifest-path engine/Cargo.toml --all-features

  macos:
    name: macos-15
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/hito')
    # 05/11/2026: macos-latest (arm64) sin capacidad, jobs sin adquirir; se usa macos-15 hasta que se recupere.
    runs-on: macos-15
    # La pasada de motor en macOS depende de que haya runner (macos-15 a veces no se adquiere y el
    # job se cancela sin ejecutar nada): el tope evita colas eternas; la app sí pasa sus pruebas
    # reales de ADM en el job macOS de app-build.yml.
    timeout-minutes: 30
    continue-on-error: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Instalar ffmpeg (pruebas de MP3, imagen y vídeo)
        timeout-minutes: 8
        continue-on-error: true
        run: brew install ffmpeg
      - run: cargo fmt --all --check --manifest-path engine/Cargo.toml
      - run: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path engine/Cargo.toml --all-features

  windows:
    name: windows-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/hito')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Instalar ffmpeg (pruebas de MP3, imagen y vídeo)
        timeout-minutes: 8
        continue-on-error: true
        shell: bash
        run: choco install ffmpeg -y
      # DIAG-TEMP (se quita antes del commit final)
      - name: Diagnóstico ffmpeg/color
        shell: bash
        continue-on-error: true
        run: |
          set +e
          which -a ffmpeg ffprobe
          ls -la /c/ProgramData/chocolatey/bin | grep -i ffmpeg
          ls -R /c/ProgramData/chocolatey/lib/ffmpeg | head -30
          ffmpeg -version | head -3
          ffmpeg -hide_banner -encoders | grep -i "_mf"
          cd "$RUNNER_TEMP"
          VF="scale=out_color_matrix=bt709:out_range=tv,format=yuv420p"
          TAGS="-color_primaries bt709 -color_trc bt709 -colorspace bt709"
          SRC="-f lavfi -i testsrc=s=640x360:r=30:d=1"
          probe() { ffprobe -v error -show_streams -select_streams v:0 "$1" | grep -E "^(color_|pix_fmt|profile)"; ffprobe -v trace "$1" 2>&1 | grep -ci "colr" ; }
          SP="scale=out_color_matrix=bt709:out_range=tv,format=yuv420p,setparams=colorspace=bt709:color_primaries=bt709:color_trc=bt709:range=tv"
          echo "== F: setparams sin write_colr"
          ffmpeg -hide_banner -y $SRC -vf "$SP" $TAGS -c:v h264_mf -profile:v 100 -f mp4 f.mp4 2>&1 | grep -E "Stream #0:0: Video: h264"; probe f.mp4
          echo "== G: setparams + write_colr (lo que lleva el motor)"
          ffmpeg -hide_banner -y $SRC -vf "$SP" $TAGS -c:v h264_mf -profile:v 100 -movflags +faststart+write_colr -f mp4 g.mp4 2>&1 | grep -E "Stream #0:0: Video: h264"; probe g.mp4
          echo "== H: setparams + write_colr + bsf h264_metadata"
          ffmpeg -hide_banner -y $SRC -vf "$SP" $TAGS -c:v h264_mf -profile:v 100 -movflags +write_colr -bsf:v "h264_metadata=colour_primaries=1:transfer_characteristics=1:matrix_coefficients=1:video_full_range_flag=0" -f mp4 h.mp4 2>&1 | grep -E "Stream #0:0: Video: h264"; probe h.mp4
          echo "== I: hevc_mf"
          ffmpeg -hide_banner -y $SRC -vf "$SP" -c:v hevc_mf -profile:v 1 -tag:v hvc1 -f mp4 i.mp4 2>&1 | tail -4
      - name: Diagnóstico cancelación (traza)
        shell: bash
        continue-on-error: true
        env:
          NORTIA_FFMPEG_TRACE: "1"
        run: cargo test --manifest-path engine/Cargo.toml -p masterout-core --test media_video cancel_kills_ffmpeg -- --nocapture
      - run: cargo fmt --all --check --manifest-path engine/Cargo.toml
      - run: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path engine/Cargo.toml --all-features
