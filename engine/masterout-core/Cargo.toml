[package]
name = "masterout-core"
version = "0.1.0"
edition = "2021"

[dependencies]
ebur128 = "0.1"
rubato = "0.16"
rand = "0.8"
thiserror = "2"
serde_json = "1.0.154"
flac-codec = { version = "1.3.3", default-features = false }
rayon = "1.12.0"
id3 = "1.17.2"
num_cpus = "1.17.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
moxcms = "0.9.1"

[features]
# Ganchos de prueba (inyección de fallos). Sin ella no existen en el binario de producción;
# las pruebas del propio crate la activan por la dependencia de desarrollo de abajo.
test-hooks = []
# Admite ffmpeg/ffprobe de MASTERCHECK_FFMPEG/MASTERCHECK_FFPROBE y del PATH también en release
# (p. ej. `cargo test --release`). Nunca en el binario que se distribuye.
dev-sidecar = []

[dev-dependencies]
masterout-core = { path = ".", features = ["test-hooks"] }
claxon = "0.4.3"
img-parts = "0.4.2"
metaflac = "0.2.8"
tempfile = "3"
