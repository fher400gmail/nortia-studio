[package]
name = "mastercheck-app"
version = "0.1.0"
description = "master check · ferboix. studio"
edition = "2021"
rust-version = "1.77"

# Crate propio (no cuelga del workspace del motor): Tauri solo se compila en CI.
[workspace]

[lib]
name = "mastercheck_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `app` enlaza Tauri (comandos, ventana). Sin ella el crate solo contiene la lógica pura
# (sidecar, locale, humo) y se puede probar donde no hay GTK/WebKit:
#   cargo test --no-default-features
default = ["app"]
app = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-os",
]

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
mastercheck-bridge = { path = "../../engine/mastercheck-bridge" }
masterout-core = { path = "../../engine/masterout-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-os = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
