const env=t=>{for(let i=0;i<ENV.length-1;i++){const[a,x]=ENV[i],[b,y]=ENV[i+1];if(t>=a&&t<=b)return x+(y-x)*(t-a)/(b-a)}return .1};

    const cl=opt.clips&&CLIPS.some(c=>Math.abs(t-c)<.55/n*1.2);if(cl)a=1;
    const bh=Math.max(3,a*h),cls=cl?'c':(opt.prog!=null&&t<=opt.prog?'p':'');
    o+=`<rect class="${cls}" x="${(i*bw).toFixed(1)}" y="${((h-bh)/2).toFixed(1)}" width="${(bw-g).toFixed(1)}" height="${bh.toFixed(1)}" rx="${((bw-g)/2).toFixed(1)}"/>`}
  return `<svg class="wv" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${o}</svg>`}

/* 3 */`<div class="two"><div><div class="tabs" id="tabs"></div><div class="card list" id="list"></div></div>${treePanel('Así queda tu carpeta')}</div>`,
/* 4 */`<div class="two"><div id="s4left"></div>${treePanel('Carpeta de salida')}</div>`];
app.innerHTML=titlebar()+`<div class="stepper" id="stp"><div class="line"><i></i></div>${STEPS.map((s,i)=>`<button class="st" data-s="${i+1}"><span class="nd"></span><span class="sl">${s}</span></button>`).join('')}<div class="mk">${sym(36)}</div></div>
<div class="main"><div id="panes" style="height:100%">${panes.map((p,i)=>`<section class="pane" data-p="${i+1}"><div class="hd"><h1>${HEAD[i][0]}</h1><p>${HEAD[i][1]}</p></div>${p}</section>`).join('')}</div></div>
<div class="foot" id="foot"></div>`;
themeInit();
let tab='Streaming';
function stepUI(){
  document.querySelectorAll('.st').forEach(b=>{const i=+b.dataset.s;b.classList.toggle('done',i<cur);b.classList.toggle('cur',i===cur);b.querySelector('.nd').innerHTML=i<cur?IC.check:i});
  document.querySelector('.stepper .line i').style.width=((cur-1)/3*100)+'%';
  document.querySelector('.mk').style.left=(12.5+(cur-1)*25)+'%';
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('cur',+p.dataset.p===cur));
  mountTrees();foot();dyn()}
function go(n){cur=Math.max(1,Math.min(4,n));stepUI();const u=new URL(location);u.searchParams.set('step',cur);history.replaceState(0,'',u)}
document.querySelectorAll('.st').forEach(b=>b.onclick=()=>go(+b.dataset.s));
function mountTrees(){const pane=document.querySelector('.pane.cur');const el=pane.querySelector('#tree');
  document.querySelectorAll('#tree').forEach(n=>n.removeAttribute('id'));
  /* un solo árbol activo a la vez */
  if(el){el.id='tree';MO.subs=MO.subs.filter(f=>!f.isTree);MO.mountTree(el);MO.subs[MO.subs.length-1].isTree=true}}
function tabsHTML(){return GROUPS.map(g=>{const ds=D.filter(d=>d.g===g),n=ds.filter(d=>MO.on.has(d.id)).length;return `<button class="tab ${g===tab?'cur':''}" data-g="${g}">${g}<em>${n}/${ds.length}</em></button>`}).join('')}
function listHTML(){return D.filter(d=>d.g===tab).map(d=>{const on=MO.on.has(d.id);return `<div class="row ${on?'on':'off'}" data-id="${d.id}"><button class="sw" role="switch" aria-checked="${on}" aria-label="${d.n}"></button>
 <span class="mono ${on?'on':''}">${d.m}</span><div class="nm"><b>${d.n}</b><span class="sp2">${d.spec}</span>${on?`<span class="why ${d.sev}">${d.why.replace(/^Cumple · /,'').replace(/^./,c=>c.toUpperCase())}</span>`:''}</div>
 <div class="rt"><span class="sevoff ${d.sev}">${IC[d.sev]}${SEVL[d.sev]}</span></div></div>`}).join('')}
function dyn(){
  const s=MO.stats();
  if(cur===3){const t=document.getElementById('tabs'),l=document.getElementById('list');t.innerHTML=tabsHTML();l.innerHTML=listHTML();
    t.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.g;dyn()});
    l.querySelectorAll('.row').forEach(r=>r.onclick=()=>MO.toggle(r.dataset.id));
    /* row layout: icono de semáforo como 3ª columna cuando está activo */
    l.querySelectorAll('.row.on').forEach(r=>{const d=MO.byId[r.dataset.id];r.querySelector('.rt').innerHTML=`<span class="sev ${d.sev}">${IC[d.sev]}${SEVL[d.sev]}</span>`})}
  if(cur===4){const h=document.querySelector('.pane.cur .hd');const m=MO.exp.mode;h.querySelector('h1').textContent=m==='run'?'Exportando tu entrega':m==='done'?'Entrega terminada':HEAD[3][0];h.querySelector('p').textContent=m==='run'?'Cada destino se procesa en paralelo. Puedes cancelar sin dejar archivos a medias.':m==='done'?'Abre la carpeta y sube cada archivo a su plataforma.':HEAD[3][1]}
  const tc=document.getElementById('tcount');if(tc)tc.textContent=s.n+' archivos + '+s.docs+' documentos';
  const tf=document.getElementById('tfoot');if(tf)tf.innerHTML=`<span><b>${s.n+s.docs}</b> archivos</span><span><b>${sizeStr(s.mb)}</b></span>`;
  if(cur===4)s4()}
function s4(){const el=document.getElementById('s4left'),e=MO.exp,s=MO.stats();let h;
 const act=D.filter(d=>MO.on.has(d.id));
 if(e.mode==='idle'){
  h=`<div class="card rev"><div class="rv"><span class="k">Tema</span><span class="v">${ART} — ${TIT}</span><a>Cambiar</a></div>
  <div class="rv"><span class="k">Máster</span><span class="v">${M.bits} bit · ${M.khz} kHz · ${nf(M.lufs)} LUFS · +${nf(M.tp)} dBTP</span><a>Ver</a></div>
  <div class="rv"><span class="k">Carpeta</span><span class="v">~/Música/Entregas</span><a>Cambiar</a></div>
  <div class="rv" style="align-items:flex-start"><span class="k" style="padding-top:4px">Destinos</span><div class="dchips">${act.map(d=>`<span class="dchip"><span class="${d.sev}">${IC[d.sev]}</span>${d.n}</span>`).join('')}</div><a data-go="3">Editar</a></div></div>
  <div class="alert wn" style="margin-top:16px">${IC.wn}<div><b>${s.er} destinos no cumplen: ${act.filter(d=>d.sev==='er').map(d=>d.n).join(' y ')}</b><span>Puedes exportar igualmente. El máster no se modifica; para corregir el pico, vuelve a tu DAW.</span></div></div>`}
 else if(e.mode==='run'){const o=MO.overall();
  h=`<div class="card xph"><div style="display:flex;justify-content:space-between;align-items:flex-end"><span class="pct" data-totalpc>${Math.round(o)} %</span><span style="color:var(--tx2);font-size:14px" data-eta>${MO.eta()}</span></div><div class="bar"><i data-total style="width:${o}%"></i></div>
   <div>${act.map(d=>{const fs=MO.files().filter(x=>x.d&&x.d.id===d.id);const p=fs.reduce((a,x)=>a+(MO.exp.pct[x.k]||0)*x.mb,0)/fs.reduce((a,x)=>a+x.mb,0);return `<div class="dp ${p>=99.9?'fin':''}"><span class="mono on">${d.m}</span><span>${d.n}</span><span class="bar"><i style="width:${p}%"></i></span><span class="pp">${p>=99.9?'Listo':Math.round(p)+' %'}</span></div>`}).join('')}</div></div>`}
 else{h=`<div class="card xph" id="doneBox" style="padding:34px 28px;gap:22px"><div class="fin-h">${MO.doneMark(64)}<div><h2>Todo exportado</h2><p>${s.n+s.docs} archivos · ${sizeStr(s.mb)} · ${nf(MO.exp.secs||7.4)} s</p></div></div>
   <div style="display:flex;gap:10px"><button class="btn pri" style="height:44px;padding:0 20px">${IC.reveal}Mostrar en Finder</button><button class="btn" style="height:44px;padding:0 18px" id="again">Nueva entrega</button></div>
   <p style="color:var(--tx2);font-size:13px">El README explica qué archivo va a cada plataforma y por qué.</p></div>`}
 el.innerHTML=h;el.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>go(+a.dataset.go));
 if(e.mode==='done'&&!e.celebrated){e.celebrated=1;MO.confetti(document.getElementById('doneBox'))}
 const ag=document.getElementById('again');if(ag)ag.onclick=()=>{MO.exp={mode:'idle',pct:{}};MO.refresh();foot()}}
function foot(){const s=MO.stats(),e=MO.exp;let h='';const back=cur>1&&e.mode!=='run'?`<button class="btn" id="bk">${IC.left}Atrás</button>`:'<span></span>';
 const sm=`<div class="sm"><span><b>${s.dest}</b> destinos</span><span><b>${s.n+s.docs}</b> archivos</span><span><b>${sizeStr(s.mb)}</b></span></div>`;
 let nx;
 if(cur<3)nx=`<button class="btn pri" id="nx">Siguiente: ${STEPS[cur]}${IC.chev}</button>`;
 else if(cur===3)nx=`<button class="btn pri" id="nx">Siguiente: Exportar${IC.chev}</button>`;
 else if(e.mode==='idle')nx=`<button class="btn pri" id="nx">Exportar ${s.dest} destinos</button>`;
 else if(e.mode==='run')nx=`<button class="btn" id="cx">Cancelar</button>`;
 else nx=`<span></span>`;
 document.getElementById('foot').innerHTML=back+'<div class="sp"></div>'+(e.mode==='done'?'':sm)+nx;
 const b=document.getElementById('bk');if(b)b.onclick=()=>go(cur-1);
 const n=document.getElementById('nx');if(n)n.onclick=()=>cur===4?MO.start():go(cur+1)}
MO.subs.push(()=>{dyn();if(cur===4)foot()});
MO.listeners.push(()=>foot());
if(Q.get('state')==='exporting')MO.snapshot();
if(Q.get('state')==='done'){MO.files().forEach(x=>MO.exp.pct[x.k]=100);MO.exp.mode='done';MO.exp.celebrated=1;MO.exp.secs=7.4}
document.querySelector('.stepper .line i').style.transition='none';
stepUI();
if(STILL){document.querySelector('.mk').style.transition='none'}
</script></body></html>
