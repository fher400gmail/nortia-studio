name: app

on:
  push:
    branches: [main, "hito*"]
    paths:
      - "app/**"
      - "engine/**"
      - ".github/workflows/app-build.yml"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Barato: detecta errores de compilación de src-tauri antes de gastar minutos de macOS.
  check:
    name: linux · check + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Dependencias de Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: cargo check (feature app)
        working-directory: app/src-tauri
        run: cargo check -p mastercheck-app --features app
      - name: clippy (feature app)
        working-directory: app/src-tauri
        run: cargo clippy -p mastercheck-app --features app --all-targets -- -D warnings
      - name: tests de la lógica pura
        working-directory: app/src-tauri
        run: cargo test --no-default-features

  macos:
    name: macos-15 · build
    needs: check
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build universal (sin firma ni notarización)
        working-directory: app
        run: npx --yes @tauri-apps/cli@^2 build --target universal-apple-darwin
      - name: Empaquetar el .app en zip
        run: |
          B=app/src-tauri/target/universal-apple-darwin/release/bundle
          find "$B" -maxdepth 3 | head -50
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$B/macos/master check.app" "out/master-check-macos-app.zip"
          cp "$B"/dmg/*.dmg out/
          ls -la out
      - name: Verificar el .app (Info.plist, binario, arquitecturas)
        run: |
          APP="app/src-tauri/target/universal-apple-darwin/release/bundle/macos/master check.app"
          P="$APP/Contents/Info.plist"
          ls -la "$APP/Contents/MacOS" "$APP/Contents/Resources"
          MIN=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$P")
          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$P")
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$P")
          echo "LSMinimumSystemVersion=$MIN CFBundleIdentifier=$ID CFBundleExecutable=$EXE"
          test "$MIN" = "14.0"
          test "$ID" = "studio.nortia.mastercheck"
          test -x "$APP/Contents/MacOS/$EXE"
          lipo -archs "$APP/Contents/MacOS/$EXE"
          du -sh "$APP" out/*
      - uses: actions/upload-artifact@v4
        with:
          name: master-check-macos
          path: out/*
          if-no-files-found: error

  windows:
    name: windows-latest · build
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build (sin firma)
        working-directory: app
        run: npx --yes @tauri-apps/cli@^2 build
      - uses: actions/upload-artifact@v4
        with:
          name: master-check-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
